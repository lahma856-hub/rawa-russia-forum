<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>RP Forum FULL</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0a0a0a;
    color:white;
}

.topbar {
    background:#111;
    padding:15px;
    border-bottom:2px solid #ff0033;
    display:flex;
    justify-content:space-between;
}

.container { display:flex; }

.sidebar {
    width:230px;
    background:#0f0f0f;
    height:100vh;
    padding:10px;
}

button {
    width:100%;
    margin:5px 0;
    padding:10px;
    background:#1a1a1a;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover { background:#ff0033; }

.content { flex:1; padding:15px; }

.card {
    background:#111;
    padding:10px;
    margin:10px 0;
    border-left:3px solid #ff0033;
}

input, textarea {
    width:100%;
    padding:10px;
    margin:5px 0;
    background:#1a1a1a;
    border:none;
    color:white;
}

.badge {
    padding:3px 8px;
    font-size:12px;
    border-radius:5px;
    margin-left:5px;
}

.admin { background:red; }
.mod { background:orange; }
.player { background:gray; }
.black { background:black; color:red; }

.page { display:none; }
.active { display:block; }
</style>
</head>

<body>

<div class="topbar">
<div>🔥 RP FORUM</div>
<div id="userBar"></div>
</div>

<div class="container">

<div class="sidebar">
<button onclick="openPage('home')">🏠 Форум</button>
<button onclick="openPage('create')">➕ Пост</button>
<button onclick="openPage('profile')">👤 Профиль</button>
<button onclick="openPage('admin')">⚙ Admin</button>
</div>

<div class="content">

<div id="home" class="page active"></div>

<div id="create" class="page">
<h2>Создать пост</h2>
<input id="title" placeholder="Заголовок">
<textarea id="text" placeholder="Текст"></textarea>
<button onclick="createPost()">Опубликовать</button>
</div>

<div id="profile" class="page">
<h2>Профиль</h2>
<input id="nick" placeholder="Ник">
<input id="avatar" placeholder="Аватар URL">
<button onclick="saveProfile()">Сохранить</button>
<div id="profileInfo"></div>
</div>

<div id="admin" class="page">
<h2>Админ панель</h2>
<div id="adminPosts"></div>
</div>

</div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID",
  appId: "YOUR_APP"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let userEmail = null;

/* LOGIN STATE */
onAuthStateChanged(auth, async (user)=>{
if(user){
userEmail = user.email;
document.getElementById("userBar").innerText = user.email;
loadPosts();
loadAdmin();
loadProfile();
}
});

/* NAV */
window.openPage = (id)=>{
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* POSTS */
window.createPost = async ()=>{
await addDoc(collection(db,"posts"),{
title: title.value,
text: text.value,
email: userEmail,
likes:0
});
loadPosts();
}

async function loadPosts(){
let snap = await getDocs(collection(db,"posts"));
let html="";

snap.forEach(d=>{
let p = d.data();

html += `
<div class="card">
<b>${p.title}</b><br>
<small>${p.email}</small>
<p>${p.text}</p>

<button onclick="likePost('${d.id}',${p.likes})">👍 ${p.likes}</button>
<button onclick="openComments('${d.id}')">💬 Комменты</button>
</div>
`;
});

document.getElementById("home").innerHTML = html;
}

/* LIKES */
window.likePost = async (id,likes)=>{
await setDoc(doc(db,"posts",id),{likes:likes+1},{merge:true});
loadPosts();
}

/* PROFILE */
window.saveProfile = async ()=>{
await setDoc(doc(db,"profiles",userEmail),{
nickname:nick.value,
avatar:avatar.value,
role:"player",
xp:0,
blacklist:0
});
}

/* LOAD PROFILE */
async function loadProfile(){
let snap = await getDocs(collection(db,"profiles"));
}

/* ADMIN DELETE */
async function loadAdmin(){
let snap = await getDocs(collection(db,"posts"));
let html="";

snap.forEach(d=>{
html += `
<div class="card">
${d.data().title}
<button onclick="deletePost('${d.id}')">🗑 удалить</button>
</div>
`;
});

document.getElementById("adminPosts").innerHTML = html;
}

window.deletePost = async (id)=>{
await deleteDoc(doc(db,"posts",id));
loadPosts();
loadAdmin();
}

</script>

</body>
</html>
