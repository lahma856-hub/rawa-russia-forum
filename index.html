<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>RP Forum Ultimate</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0a0a0a;
  color:white;
}

/* TOP */
.top {
  background:#111;
  padding:15px;
  border-bottom:2px solid #ff0033;
  display:flex;
  justify-content:space-between;
}

/* SIDEBAR */
.sidebar {
  width:240px;
  background:#0e0e0e;
  height:100vh;
  padding:10px;
  border-right:1px solid #222;
}

.container { display:flex; }

.content { flex:1; padding:15px; }

.card {
  background:#111;
  padding:10px;
  margin:10px 0;
  border-left:3px solid #ff0033;
  border-radius:6px;
}

/* BUTTON */
button {
  width:100%;
  padding:10px;
  margin:5px 0;
  background:#1a1a1a;
  color:white;
  border:none;
  cursor:pointer;
}

button:hover {
  background:#ff0033;
}

/* INPUT */
input, textarea {
  width:100%;
  padding:10px;
  margin:5px 0;
  background:#1a1a1a;
  border:none;
  color:white;
}

.page { display:none; }
.active { display:block; }

.badge {
  padding:3px 6px;
  font-size:11px;
  border-radius:4px;
}

.admin { background:red; }
.mod { background:orange; }
.player { background:gray; }
</style>
</head>

<body>

<div class="top">
<div>🔥 MATRESHKA STYLE RP FORUM</div>
<div id="user"></div>
</div>

<div class="container">

<div class="sidebar">
<button onclick="openPage('home')">🏠 Форум</button>
<button onclick="openPage('create')">➕ Создать тему</button>
<button onclick="openPage('profile')">👤 Профиль</button>
<button onclick="openPage('admin')">⚙ Админ</button>
</div>

<div class="content">

<div id="home" class="page active"></div>

<div id="create" class="page">
<h2>Создать тему</h2>
<input id="title" placeholder="Заголовок">
<textarea id="text" placeholder="Текст"></textarea>
<button onclick="createPost()">Опубликовать</button>
</div>

<div id="profile" class="page">
<h2>Профиль</h2>
<input id="nick" placeholder="Ник">
<input id="avatar" placeholder="Аватар URL">
<button onclick="saveProfile()">Сохранить</button>
<div id="profileBox"></div>
</div>

<div id="admin" class="page">
<h2>Админ панель</h2>
<div id="adminBox"></div>
</div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, setDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID",
  appId: "YOUR_APP"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let email = null;

/* LOGIN */
onAuthStateChanged(auth, (user)=>{
if(user){
email = user.email;
document.getElementById("user").innerText = email;

loadPosts();
loadAdmin();
loadProfile();
}
});

/* NAV */
window.openPage = (id)=>{
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* POSTS */
window.createPost = async ()=>{
await addDoc(collection(db,"posts"),{
title:title.value,
text:text.value,
email,
likes:0
});
loadPosts();
}

async function loadPosts(){
let snap = await getDocs(collection(db,"posts"));
let html="";

snap.forEach(d=>{
let p = d.data();

html += `
<div class="card">
<b>${p.title}</b><br>
<small>${p.email}</small>
<p>${p.text}</p>

<button onclick="like('${d.id}',${p.likes})">👍 ${p.likes}</button>
</div>
`;
});

document.getElementById("home").innerHTML = html;
}

/* LIKE */
window.like = async (id,likes)=>{
await setDoc(doc(db,"posts",id),{likes:likes+1},{merge:true});
loadPosts();
}

/* PROFILE */
window.saveProfile = async ()=>{
await setDoc(doc(db,"users",email),{
nickname:nick.value,
avatar:avatar.value,
role:"player",
xp:0,
blacklist:0
});
}

/* ADMIN */
async function loadAdmin(){
let snap = await getDocs(collection(db,"posts"));
let html="";

snap.forEach(d=>{
html += `
<div class="card">
${d.data().title}
<button onclick="del('${d.id}')">🗑 delete</button>
</div>
`;
});

document.getElementById("adminBox").innerHTML = html;
}

window.del = async (id)=>{
await deleteDoc(doc(db,"posts",id));
loadPosts();
loadAdmin();
}
</script>

</body>
</html>
