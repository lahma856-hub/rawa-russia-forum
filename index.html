<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>RP ULTRA FORUM</title>

<style>
body {
margin:0;
font-family: Arial;
background:#090909;
color:white;
}

/* TOP */
.topbar{
background:#111;
padding:15px;
border-bottom:2px solid #ff0033;
display:flex;
justify-content:space-between;
}

/* LAYOUT */
.container{display:flex;}

.sidebar{
width:240px;
background:#0d0d0d;
height:100vh;
padding:10px;
border-right:1px solid #222;
}

button{
width:100%;
padding:10px;
margin:5px 0;
background:#1a1a1a;
border:none;
color:white;
cursor:pointer;
}

button:hover{background:#ff0033;}

.content{flex:1;padding:15px;}

.card{
background:#111;
padding:10px;
margin:10px 0;
border-left:3px solid #ff0033;
border-radius:6px;
}

/* INPUT */
input,textarea{
width:100%;
padding:10px;
margin:5px 0;
background:#1a1a1a;
border:none;
color:white;
}

.badge{
padding:3px 6px;
font-size:11px;
border-radius:4px;
}

.admin{background:red;}
.mod{background:orange;}
.player{background:gray;}
.black{background:black;color:red;}

.page{display:none;}
.active{display:block;}
</style>
</head>

<body>

<div class="topbar">
<div>🔥 MAJESTIC STYLE RP FORUM ULTRA</div>
<div id="me"></div>
</div>

<div class="container">

<div class="sidebar">
<button onclick="openPage('home')">🏠 Форум</button>
<button onclick="openPage('create')">➕ Создать тему</button>
<button onclick="openPage('profile')">👤 Профиль</button>
<button onclick="openPage('admin')">⚙ Админ</button>
</div>

<div class="content">

<div id="home" class="page active"></div>

<div id="create" class="page">
<h2>Создать тему</h2>
<input id="title" placeholder="Название">
<textarea id="text" placeholder="Текст"></textarea>
<button onclick="createPost()">Опубликовать</button>
</div>

<div id="profile" class="page">
<h2>Профиль</h2>
<input id="nick" placeholder="Ник">
<input id="avatar" placeholder="Аватар URL">
<button onclick="saveProfile()">Сохранить</button>
<div id="profileBox"></div>
</div>

<div id="admin" class="page">
<h2>Админ панель</h2>
<div id="adminBox"></div>
</div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getAuth, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
setDoc,
doc,
deleteDoc,
getDoc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_ID",
appId: "YOUR_APP"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let email = null;

/* LOGIN */
onAuthStateChanged(auth,(user)=>{
if(user){
email=user.email;
document.getElementById("me").innerText=email;
loadPosts();
loadAdmin();
loadProfile();
}
});

/* NAV */
window.openPage=(id)=>{
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* POSTS */
window.createPost=async()=>{
await addDoc(collection(db,"posts"),{
title:title.value,
text:text.value,
email,
likes:0,
createdAt:Date.now()
});
loadPosts();
}

/* LOAD POSTS + COMMENTS + LIKES */
async function loadPosts(){
let snap=await getDocs(collection(db,"posts"));
let html="";

snap.forEach(d=>{
let p=d.data();

html+=`
<div class="card">
<b>${p.title}</b><br>
<small>${p.email}</small>
<p>${p.text}</p>

<button onclick="like('${d.id}',${p.likes})">👍 ${p.likes}</button>
<button onclick="comment('${d.id}')">💬 Коммент</button>
</div>
`;
});

document.getElementById("home").innerHTML=html;
}

/* LIKE SYSTEM */
window.like=async(id,likes)=>{
await updateDoc(doc(db,"posts",id),{
likes:likes+1
});
loadPosts();
}

/* COMMENTS */
window.comment=async(postId)=>{
let text=prompt("Комментарий:");
if(!text)return;

await addDoc(collection(db,"comments"),{
postId,
text,
email
});
alert("Комментарий добавлен");
}

/* PROFILE */
window.saveProfile=async()=>{
let userRef=doc(db,"users",email);

let snap=await getDoc(userRef);

let xp=0;
let role="player";

if(snap.exists()){
xp=snap.data().xp||0;
role=snap.data().role||"player";
}

await setDoc(userRef,{
nickname:nick.value,
avatar:avatar.value,
email,
xp,
role,
blacklist:0
});
}

/* ADMIN */
async function loadAdmin(){
let snap=await getDocs(collection(db,"posts"));
let html="";

snap.forEach(d=>{
html+=`
<div class="card">
${d.data().title}
<button onclick="del('${d.id}')">🗑 удалить</button>
</div>
`;
});

document.getElementById("adminBox").innerHTML=html;
}

window.del=async(id)=>{
await deleteDoc(doc(db,"posts",id));
loadPosts();
loadAdmin();
}
</script>

</body>
</html>
